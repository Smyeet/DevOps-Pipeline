when:
  - event: push
  - event: pull_request
  
steps:
  - name: test-and-codecov
    image: python:3.12-slim
    commands:
      - pip install -r requirements.txt
      - pip install codecov-cli
      - python -m pytest -v --cov=app --cov-report=xml
      - codecovcli upload-process

  - name: verify
    image: python:3.12-slim
    commands:
      - python app.py
